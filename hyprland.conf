$activeBorderColor = rgb(AE3F82) rgb(AE3F82) rgb(AE3F82) rgb(AE3F82) rgb(E39C45) rgb(AE3F82) rgb(AE3F82) rgb(AE3F82) 35deg
$inactiveBorderColor = rgba(725a5acc)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
  blur {
     size = 4
     passes = 3
  }
  rounding = 8
}

layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace walker

animation = workspaces, 1, 6, easeOutQuint, slide
animation = workspacesIn, 1, 6, easeOutQuint, slide
animation = workspacesOut, 1, 6, easeOutQuint, slide


